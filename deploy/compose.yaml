services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dbie
      POSTGRES_USER: dbie
      POSTGRES_PASSWORD: ${DBIE_POSTGRES_PASSWORD:?set DBIE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbie -d dbie"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true

volumes:
  dbie-postgres:
