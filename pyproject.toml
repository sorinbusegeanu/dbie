[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbie"
version = "0.1.0"
description = "Digital Business Idea Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai==0.9.2",
  "crewai==1.15.13",
  "docker==7.2.0",
  "docling==2.123.1",
  "fastembed==0.8.0",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "markdown>=3.8,<4",
  "pgvector==0.5.0",
  "playwright==1.62.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pygithub==2.10.0",
  "pymupdf==1.28.2",
  "psycopg[binary]==3.3.4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "trafilatura==2.2.0",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
reddit = ["praw==8.0.3"]

[project.scripts]
dbie = "dbie.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dbie"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
