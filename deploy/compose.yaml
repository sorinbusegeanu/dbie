services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dbie
      POSTGRES_USER: dbie
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbie -d dbie"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    environment:
      # A credential is required for Crawl4AI to bind beyond its container's
      # loopback interface. The published port is still host-loopback only.
      CRAWL4AI_API_TOKEN: ${DBIE_CRAWL4AI_API_TOKEN:-dbie-local-crawl4ai-token-v1}
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1gb"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Authorization: Bearer '$$CRAWL4AI_API_TOKEN http://localhost:11235/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  dbie-postgres:
